# Compila la app web y la publica en GitHub Pages (rama gh-pages)
# cada vez que cambia algo dentro de app/.
name: Publicar app

on:
  push:
    branches: [claude/pensive-goldberg-95c7no, main]
    paths: ['app/**', '.github/workflows/publicar-app.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-app
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/dist
          publish_branch: gh-pages
          commit_message: Publicar app web
